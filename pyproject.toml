[project]
name = "rematch"
version = "0.0.1"
description = "Agent harness for matching decompilation with headless Claude Code workers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyelftools>=0.33",
    "typer>=0.12",
]

[project.scripts]
rematch = "rematch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rematch"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Docs keep their hand-aligned code blocks.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typer declares options as call defaults.
"src/rematch/cli.py" = ["B008"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
